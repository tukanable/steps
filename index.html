<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Original Sin — путники и цель</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <button id="play">▶ Play</button>
    <span id="dist">у цели: —</span>
    <span id="best">ближе всего: —</span>
    <span id="stepread">скорость ×0.50</span>
    <label class="ctl">
      точек
      <input type="range" id="count" min="1" max="1000" step="1" value="1">
      <span id="countread">1</span>
    </label>
    <label class="ctl">
      скорость
      <input type="range" id="step" min="0" max="3" step="0.01" value="0.5">
    </label>
    <button id="restart">Заново</button>
  </div>

  <div id="subtitle"></div>

  <audio id="narration" src="narration.mp3" preload="auto"></audio>

  <script src="timeline.js"></script>
  <script src="script.js"></script>
</body>
</html>
